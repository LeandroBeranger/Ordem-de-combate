<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador de Iniciativa RPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚔️ Ordem de Combate ⚔️</h1>
        
        <form id="form-combatente" class="painel-input">
            <input type="text" id="nome" placeholder="Nome" required>
            <input type="number" id="iniciativa" placeholder="Iniciativa" min="0" required>
            <input type="number" id="hpMax" placeholder="HP" min="1" required>
            <button type="submit" class="btn-add">+ Adicionar</button>
        </form>

        <div class="painel-rodada">
            <div>📜 Rodada: <strong id="numero-rodada">1</strong></div>
            <div>⏳ Turno Geral: <strong id="numero-turno">0</strong></div>
        </div>

        <div class="controles-batalha">
            <button id="btn-ordenar" class="btn-combate">🎲 Ordenar por Iniciativa</button>
            <button id="btn-proximo" class="btn-combate">➡️ Próximo Turno</button>
        </div>

        <div id="lista-combatentes" class="lista"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
